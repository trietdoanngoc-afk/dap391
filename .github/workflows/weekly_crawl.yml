name: Weekly Data Crawler

on:
  schedule:
    - cron: '0 0 * * 1' # Runs at 00:00 every Monday (UTC)
  workflow_dispatch: # Allows manual trigger

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          pip install google-play-scraper pandas sqlalchemy pymysql python-dotenv

      - name: Run Crawler Script
        run: python crawler.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
